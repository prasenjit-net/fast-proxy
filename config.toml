# ------------------------------------------------------------------
# fast-proxy configuration
#
# Every value here can be overridden on the command line, e.g.:
#   fast-proxy --config other.toml --admin-listen 127.0.0.1:9100 --log-level debug
# ------------------------------------------------------------------

# Process-level settings only. Subsystems, hosts, routes, and upstreams are
# managed live in the admin UI and stored in the database below.
[data_plane]
# Directory for the database and other persistent state (created if missing).
state_dir = "./state"
# Database file. Default: <state_dir>/fast-proxy.db
# database = "./state/fast-proxy.db"
# CIDRs whose X-Forwarded-* headers are trusted. Empty: always overwrite them.
trusted_proxies = []
# How long in-flight requests may finish after a shutdown signal.
shutdown_grace = "30s"

# One entry per plain-HTTP listener. TLS arrives in a later milestone.
[[data_plane.listener]]
name = "http"
listen = "0.0.0.0:8000"

[admin]
# The admin plane (UI, REST API, /metrics) has no authentication yet.
# Keep it on loopback.
listen = "127.0.0.1:9000"

[logging]
# tracing filter: trace | debug | info | warn | error
# (also accepts full directives like "info,access=debug")
level = "info"
# Per-request access log file. Comment out (or pass --no-access-log)
# to disable the file; requests are still logged to the console.
access_log = "access.log"

[ui]
# This whole section is served to the SPA via GET /api/config.
app_name = "Fast Proxy"
tagline = "Realtime-configurable ingress and reverse proxy"
# Theme the UI uses until the visitor picks one: light | dark | auto
default_theme = "auto"
repo_url = "https://github.com/prasenjit-net/fast-proxy"
