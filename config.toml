# ------------------------------------------------------------------
# fast-proxy configuration
#
# Every value here can be overridden on the command line, e.g.:
#   fast-proxy --config other.toml --admin-listen 127.0.0.1:9100 --log-level debug
# ------------------------------------------------------------------

# Process-level settings only. Subsystems, hosts, routes, and upstreams are
# managed live in the admin UI and stored in the database below.
[data_plane]
# Directory for the database and other persistent state (created if missing).
state_dir = "./state"
# Database file. Default: <state_dir>/fast-proxy.db
# database = "./state/fast-proxy.db"
# CIDRs whose X-Forwarded-* headers are trusted. Empty: always overwrite them.
trusted_proxies = []
# How long in-flight requests may finish after a shutdown signal.
shutdown_grace = "30s"

# The master key file that seals private keys stored in the database (created
# the first time a key must be sealed). FAST_PROXY_MASTER_KEY (base64 of 32
# bytes) overrides it; all instances sharing one database need the same key.
# Back it up separately from the database. Default: <state_dir>/master.key
# master_key_file = "./state/master.key"
# How often to look for changes made by another instance. "0s" turns it off.
config_poll_interval = "5s"

# One entry per plain-HTTP listener.
[[data_plane.listener]]
name = "http"
listen = "0.0.0.0:8000"

# TLS termination. Off by default. When on, an HTTPS listener starts next to the
# plain ones and each subsystem opts in to HTTPS in the admin UI/API. No
# certificate or key lives in this file: certificates are uploaded (or
# generated for development) in the admin UI and stored in the database.
# `--tls` / `--no-tls` / `--https-listen` override the first two keys.
[data_plane.tls]
enabled = false
listen = "0.0.0.0:8443"
# The port redirects point at (NAT, containers). Default: the port of `listen`.
# public_port = 443
# Lowest TLS version accepted: "1.2" or "1.3".
min_version = "1.2"
http2 = true
# Fail the handshake for an unknown name instead of presenting a placeholder.
reject_unknown_sni = false
handshake_timeout = "10s"
max_concurrent_handshakes = 256

[admin]
# The admin plane (UI, REST API, /metrics) has no authentication yet.
# Keep it on loopback.
listen = "127.0.0.1:9000"

[logging]
# tracing filter: trace | debug | info | warn | error
# (also accepts full directives like "info,access=debug")
level = "info"
# Per-request access log file. Comment out (or pass --no-access-log)
# to disable the file; requests are still logged to the console.
access_log = "access.log"

[ui]
# This whole section is served to the SPA via GET /api/config.
app_name = "Fast Proxy"
tagline = "Realtime-configurable ingress and reverse proxy"
# Theme the UI uses until the visitor picks one: light | dark | auto
default_theme = "auto"
repo_url = "https://github.com/prasenjit-net/fast-proxy"
