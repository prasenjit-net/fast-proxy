name: Publish Release

on:
  push:
    branches: [main]

concurrency:
  group: publish-release-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Qualify release merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_publish: ${{ steps.pr.outputs.should_publish }}
      version: ${{ steps.pr.outputs.version }}
      tag: ${{ steps.pr.outputs.tag }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")

          match=$(printf '%s' "$prs" | jq -c --arg sha "$GITHUB_SHA" '
            [
              .[]
              | select(.merge_commit_sha == $sha)
              | select(.base.ref == "main")
              | select(.head.ref | startswith("release/"))
              | select([.labels[].name] | index("release"))
            ]
            | first // empty
          ')

          if [ -z "$match" ]; then
            echo "No merged release PR is associated with ${GITHUB_SHA}; skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_ref=$(printf '%s' "$match" | jq -r '.head.ref')
          pr_number=$(printf '%s' "$match" | jq -r '.number')
          tag="${head_ref#release/}"
          version="${tag#v}"

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release branch '${head_ref}' must be named release/vMAJOR.MINOR.PATCH."
            exit 1
          fi

          {
            echo "should_publish=true"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "pr_number=${pr_number}"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release version
    needs: qualify
    if: needs.qualify.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Validate version files
        run: |
          set -euo pipefail
          version="${{ needs.qualify.outputs.version }}"

          cargo_toml_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          cargo_lock_version=$(perl -0ne 'print "$1\n" if /\[\[package\]\]\nname = "fast-proxy"\nversion = "([^"]+)"/' Cargo.lock)
          package_version=$(node -p 'require("./ui/package.json").version')
          package_lock_version=$(node -p 'require("./ui/package-lock.json").version')
          package_lock_root_version=$(node -p 'require("./ui/package-lock.json").packages[""].version')

          for actual in "$cargo_toml_version" "$cargo_lock_version" "$package_version" "$package_lock_version" "$package_lock_root_version"; do
            if [ "$actual" != "$version" ]; then
              echo "::error::Version files disagree. Expected ${version}, found ${actual}."
              exit 1
            fi
          done

          cargo test --locked --no-run
          npm ci --ignore-scripts --prefix ui

  build:
    name: Build / ${{ matrix.target }}
    needs: [qualify, validate]
    if: needs.qualify.outputs.should_publish == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # Static builds (rustls and bundled SQLite need no system library): the
          # container image and the Homebrew formula on Linux use these.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # The C parts (ring, SQLite) are compiled against musl too.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc

      - name: Check the binary is static
        if: matrix.musl
        run: |
          set -euo pipefail
          description=$(file "target/${{ matrix.target }}/release/fast-proxy")
          echo "$description"
          case "$description" in
            *"statically linked"*|*"static-pie linked"*) ;;
            *) echo "::error::The musl build is not static."; exit 1 ;;
          esac

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          stage="fast-proxy-${{ needs.qualify.outputs.tag }}-${{ matrix.target }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/fast-proxy" "$stage/"
          cp README.md LICENSE config.toml "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
          shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "fast-proxy-${{ needs.qualify.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/fast-proxy.exe" -Destination $stage
          Copy-Item README.md, LICENSE, config.toml -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Get-FileHash "$stage.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $stage.zip" } |
            Out-File -Encoding ascii "$stage.zip.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.target }}
          path: |
            fast-proxy-*.tar.gz
            fast-proxy-*.tar.gz.sha256
            fast-proxy-*.zip
            fast-proxy-*.zip.sha256
          if-no-files-found: error

  tag:
    name: Create release tag
    needs: [qualify, validate, build]
    if: needs.qualify.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create or verify annotated tag
        run: |
          set -euo pipefail
          tag="${{ needs.qualify.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "${tag}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            tagged_sha=$(git rev-list -n 1 "${tag}")
            if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${tag} already exists at ${tagged_sha}, not ${GITHUB_SHA}."
              exit 1
            fi
            echo "Tag ${tag} already points to ${GITHUB_SHA}; continuing rerun."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"

  release:
    name: Publish GitHub Release
    needs: [qualify, build, tag]
    if: needs.qualify.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.qualify.outputs.tag }}
          name: ${{ needs.qualify.outputs.tag }}
          generate_release_notes: true
          files: dist/*

  image:
    name: Publish Docker image
    needs: [qualify, release]
    if: needs.qualify.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # DOCKERHUB_USERNAME (a repository variable or secret; required), DOCKERHUB_IMAGE (a
      # variable, optional: namespace/name; default <username>/fast-proxy), and the secret
      # DOCKERHUB_TOKEN. A username kept as a secret shows as *** in the logs.
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      IMAGE: docker.io/${{ vars.DOCKERHUB_IMAGE || format('{0}/fast-proxy', vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME) }}
      TAG: ${{ needs.qualify.outputs.tag }}
    steps:
      - name: Check Docker Hub settings
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::Set DOCKERHUB_USERNAME (repository variable or secret) and the secret DOCKERHUB_TOKEN (a Docker Hub access token with write access)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*-linux-musl
          path: archives
          merge-multiple: true

      - name: Unpack the static binaries
        run: |
          set -euo pipefail
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl; do
            arch="${pair%%:*}"
            target="${pair#*:}"
            stage="fast-proxy-${TAG}-${target}"
            tar -xzf "archives/${stage}.tar.gz" -C archives
            mkdir -p "dist/linux-${arch}"
            cp "archives/${stage}/fast-proxy" "dist/linux-${arch}/fast-proxy"
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest

      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: BINARY_SOURCE=prebuilt
          load: true
          push: false
          tags: fast-proxy:smoke

      - name: Smoke test
        run: |
          set -euo pipefail
          trap 'docker logs smoke || true; docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          user=$(docker image inspect -f '{{.Config.User}}' fast-proxy:smoke)
          if [ "$user" != "65532:65532" ]; then
            echo "::error::The image runs as '${user}', not the non-root user 65532."
            exit 1
          fi
          docker run -d --name smoke -p 8000:8000 fast-proxy:smoke
          for _ in $(seq 1 60); do
            if docker exec smoke /usr/local/bin/fast-proxy status --local; then
              break
            fi
            sleep 1
          done
          docker exec smoke /usr/local/bin/fast-proxy status --local
          docker exec smoke /usr/local/bin/fast-proxy --version | grep -F "${TAG#v}"
          # No subsystem is configured yet, so the data plane answers 404.
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: smoke.invalid' http://127.0.0.1:8000/)
          if [ "$status" != "404" ]; then
            echo "::error::The data plane answered ${status}, expected 404."
            exit 1
          fi

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: BINARY_SOURCE=prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  homebrew:
    name: Publish Homebrew formula
    needs: [qualify, release]
    if: needs.qualify.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Repository variable HOMEBREW_TAP_REPOSITORY (optional, owner/homebrew-name;
      # default <owner>/homebrew-tap). Secret: HOMEBREW_TAP_TOKEN, allowed to push to it.
      TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || format('{0}/homebrew-tap', github.repository_owner) }}
      VERSION: ${{ needs.qualify.outputs.version }}
    steps:
      - name: Check the tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::Set the secret HOMEBREW_TAP_TOKEN (a token that can push to ${TAP_REPOSITORY})."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write the formula
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "$VERSION" dist "$GITHUB_REPOSITORY" > tap/Formula/fast-proxy.rb
          ruby -c tap/Formula/fast-proxy.rb

      - name: Commit and push the formula
        working-directory: tap
        run: |
          set -euo pipefail
          git add Formula/fast-proxy.rb
          if git diff --cached --quiet; then
            echo "The formula for ${VERSION} is already published."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "fast-proxy ${VERSION}"
          git push
