name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Builds and tests the UI once, then hands the compiled ui/dist to the
  # backend jobs below — so `cargo test`/`cargo build` exercise the real
  # embedded SPA (rust-embed reads it from disk in debug builds) instead
  # of the build.rs-created empty placeholder.
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci --ignore-scripts

      # See src/test/setup.ts and ui/.nvmrc: Node's native (experimental)
      # global localStorage shadows jsdom's working implementation, so the
      # test script itself sets NODE_OPTIONS=--no-experimental-webstorage.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  lint:
    name: Rust lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --locked --all-targets -- -D warnings

      # The `fuzzing` features compile the doors the fuzz targets use.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  # The supply-chain gate (M7 F4): RustSec advisories, licenses, banned crates
  # and sources, as configured in deny.toml.
  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  test:
    name: Rust test / ${{ matrix.os }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # File and line in panics and backtraces, without full debug info: much
      # less to link and write, which is most of a Windows build.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-dist
          path: ui/dist

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.os }}

      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-nextest@0.9.151

      # nextest runs the tests of every binary in parallel (cargo test runs the
      # binaries one after another). No retries: a flaky test must fail.
      - run: cargo nextest run --locked --no-fail-fast

      # nextest does not run doctests; they are the same on every platform.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --doc

      # The release binaries of every platform are built by publish-release.yml;
      # here one release build checks the profile still builds and starts.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo build --release --locked

      - name: Smoke-test the release binary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          bin=target/release/fast-proxy
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version

  # The ACME client against a real ACME server (M4, Q4). Pebble's release
  # binaries are downloaded; its repository (same tag) supplies the test
  # configuration and certificates. challtestsrv answers DNS with 127.0.0.1, so
  # Pebble fetches HTTP-01 challenges from the test's own listener on port 5002.
  pebble:
    name: ACME against Pebble (Linux)
    runs-on: ubuntu-latest
    env:
      PEBBLE_VERSION: v2.10.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: letsencrypt/pebble
          ref: v2.10.3
          path: pebble-src

      - name: Download Pebble
        run: |
          for tool in pebble pebble-challtestsrv; do
            curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/letsencrypt/pebble/releases/download/${PEBBLE_VERSION}/${tool}-linux-amd64.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP"
            # The release archives do not keep the execute bit.
            chmod +x "$RUNNER_TEMP/${tool}-linux-amd64/linux/amd64/${tool}"
          done

      - name: Start Pebble
        working-directory: pebble-src
        run: |
          "$RUNNER_TEMP/pebble-challtestsrv-linux-amd64/linux/amd64/pebble-challtestsrv" \
            -defaultIPv4 127.0.0.1 -defaultIPv6 "" -http01 "" -https01 "" -tlsalpn01 "" -doh "" &
          PEBBLE_VA_NOSLEEP=1 PEBBLE_WFE_NONCEREJECT=0 \
            "$RUNNER_TEMP/pebble-linux-amd64/linux/amd64/pebble" \
            -config test/config/pebble-config.json -dnsserver 127.0.0.1:8053 &
          for attempt in $(seq 1 30); do
            curl -sk https://localhost:14000/dir >/dev/null && exit 0
            sleep 1
          done
          echo "Pebble did not start" >&2
          exit 1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: pebble

      # One test at a time: each answers challenges on Pebble's port 5002.
      - run: cargo test --locked -p fast-proxy-acme --test pebble -- --ignored --test-threads=1
        env:
          FAST_PROXY_PEBBLE_CA: ${{ github.workspace }}/pebble-src/test/certs/pebble.minica.pem

  # Fuzzing (M7 F2, ADR 0032): every target in fuzz/ for 20 s, on nightly Rust
  # with cargo-fuzz. The crate is outside the workspace, so nothing else builds
  # it. A crash fails the job and its input is uploaded; commit it as a unit
  # test in the crate that owns the function (fuzz/README.md).
  fuzz:
    name: Fuzz (20 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: fuzz
          key: fuzz

      - run: cargo install cargo-fuzz --locked --version 0.13.2

      # The nightly workflow lists the targets in its matrix; keep it in step.
      - name: The nightly matrix names every target
        run: |
          listed=$(cd fuzz && cargo +nightly fuzz list | sort)
          matrix=$(sed -n '/target:/,/^ *[a-z-]*:$/p' .github/workflows/fuzz-nightly.yml | grep -E '^ *- ' | sed 's/^ *- //' | sort)
          diff <(echo "$listed") <(echo "$matrix")

      - run: fuzz/run.sh 20

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
