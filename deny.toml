# cargo-deny: the supply-chain gate CI runs on every pull request (M7 F4, ADR 0032).
# `cargo deny check` locally; a finding is fixed, or allowed here with the reason.

[graph]
all-features = true

# RustSec advisories: vulnerabilities fail; unmaintained and unsound crates fail
# for direct dependencies and are reported for transitive ones.
[advisories]
version = 2
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only. A new one needs a reason in the pull request.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0", # webpki-root-certs: the Mozilla root list
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# The workspace's own crates are not published and carry no license field.
[licenses.private]
ignore = true

[bans]
# Duplicates are common in a tree this size (windows-sys, rand); report them,
# but never two versions of the crates the proxy is built on.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl", reason = "TLS is rustls only (ADR 0009)" },
    { crate = "openssl-sys", reason = "TLS is rustls only (ADR 0009)" },
    { crate = "native-tls", reason = "TLS is rustls only (ADR 0009)" },
]

[[bans.features]]
crate = "tokio"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
