[package]
name = "fast-proxy"
version = "0.1.0"
edition = "2021"
description = "Fast, realtime-configurable ingress server and reverse proxy: host/prefix routing, TLS + ACME, load balancing, health checks, and live diagnostics"

[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

# Shared dependency versions; member crates opt in with `{ workspace = true }`.
[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[dependencies]
fast-proxy-admin = { path = "crates/fast-proxy-admin" }
fast-proxy-config-service = { path = "crates/fast-proxy-config-service" }
fast-proxy-dataplane = { path = "crates/fast-proxy-dataplane" }
fast-proxy-health = { path = "crates/fast-proxy-health" }
fast-proxy-store = { path = "crates/fast-proxy-store" }
fast-proxy-tls = { path = "crates/fast-proxy-tls" }
fast-proxy-telemetry = { path = "crates/fast-proxy-telemetry" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = "0.8"
humantime = "2"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = "0.7"

[dev-dependencies]
fast-proxy-model = { path = "crates/fast-proxy-model" }
fast-proxy-test-pki = { path = "crates/fast-proxy-test-pki" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = { workspace = true }

[profile.release]
lto = true
strip = true
codegen-units = 1
