[package]
name = "fast-proxy-tls"
version = "0.0.0"
edition = "2021"
description = "Certificates for fast-proxy: PEM validation, the key vault, the self-signed generator, the certificate cache and rustls client configurations"
publish = false

[dependencies]
fast-proxy-model = { path = "../fast-proxy-model" }
fast-proxy-telemetry = { path = "../fast-proxy-telemetry" }
base64 = "0.22"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
sha2 = "0.10"
thiserror = { workspace = true }
time = "0.3"
tracing = { workspace = true }
x509-parser = "0.16"
zeroize = "1"

[dev-dependencies]
fast-proxy-test-pki = { path = "../fast-proxy-test-pki" }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
