[package]
name = "fast-proxy-store"
version = "0.0.0"
edition = "2021"
description = "SQLite persistence for fast-proxy configuration and revision history"
publish = false

[dependencies]
fast-proxy-model = { path = "../fast-proxy-model" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
