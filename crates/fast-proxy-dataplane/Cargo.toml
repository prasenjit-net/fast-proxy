[package]
name = "fast-proxy-dataplane"
version = "0.0.0"
edition = "2021"
description = "The hyper-based proxy data plane"
publish = false

[dependencies]
fast-proxy-balancing = { path = "../fast-proxy-balancing" }
fast-proxy-model = { path = "../fast-proxy-model" }
fast-proxy-routing = { path = "../fast-proxy-routing" }
fast-proxy-telemetry = { path = "../fast-proxy-telemetry" }
fast-proxy-tls = { path = "../fast-proxy-tls" }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = { workspace = true }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "client-legacy", "tokio", "http1"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7"
tracing = { workspace = true }

[dev-dependencies]
fast-proxy-test-pki = { path = "../fast-proxy-test-pki" }
http-body-util = { workspace = true, features = ["channel"] }
futures-util = "0.3"
tempfile = { workspace = true }
tokio-tungstenite = "0.29"
