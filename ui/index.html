<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Fast, realtime-configurable ingress server and reverse proxy" />
    <!-- The server rewrites this content= value to [ui].default_theme from
         config.toml when it serves this file (see src/static_assets.rs).
         In `npm run dev` it stays literally "__DEFAULT_THEME__", which the
         script below treats the same as "auto". -->
    <meta name="default-theme" content="__DEFAULT_THEME__" />
    <title>Fast Proxy</title>
    <!-- An external file, not an inline script: the admin plane's Content-Security-Policy
         forbids inline script. Classic and blocking on purpose, so it runs before first paint. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
