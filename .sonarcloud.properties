# SonarCloud automatic analysis settings.
#
# Released schemas are frozen copies kept as test fixtures, and each migration
# step repeats the DDL it adds to schema.sql (ADR 0028): duplication there is
# by design, so leave those files out of copy-paste detection.
sonar.cpd.exclusions=crates/fast-proxy-store/src/schema.sql,crates/fast-proxy-store/src/migrations/**/*.sql
